<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#0A0A0C"/>
  <rect x="3" y="3" width="94" height="94" rx="17" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Crown / Royal Crest -->
  <path d="M25 42L35 56L50 32L65 56L75 42L72 68H28L25 42Z" fill="url(#goldGrad)" stroke="#D4AF37" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Aluminium frame cross lines -->
  <rect x="32" y="52" width="36" height="16" rx="2" fill="#121216" stroke="#E5C158" stroke-width="1.2"/>
  <line x1="50" y1="52" x2="50" y2="68" stroke="#D4AF37" stroke-width="1.2"/>
  <line x1="32" y1="60" x2="68" y2="60" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- Tufting diamonds -->
  <circle cx="41" cy="56" r="1" fill="#D4AF37"/>
  <circle cx="59" cy="56" r="1" fill="#D4AF37"/>
  <circle cx="41" cy="64" r="1" fill="#D4AF37"/>
  <circle cx="59" cy="64" r="1" fill="#D4AF37"/>
  <!-- Crown Jewels -->
  <circle cx="25" cy="40" r="2.5" fill="#F3E5AB"/>
  <circle cx="50" cy="30" r="3" fill="#FFF"/>
  <circle cx="75" cy="40" r="2.5" fill="#F3E5AB"/>
  <!-- Bottom gold bar -->
  <rect x="32" y="72" width="36" height="3" rx="1.5" fill="url(#goldGrad)"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="20" y1="30" x2="80" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E5AB"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="0.8" stop-color="#AA7C11"/>
      <stop offset="1" stop-color="#E5C158"/>
    </linearGradient>
  </defs>
</svg>